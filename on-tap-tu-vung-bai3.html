<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ôn tập · Bài 3 · 我是中国人</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF5EC;--card:#FFFDF9;--orange:#E67762;--orange-d:#C4533E;--orange-soft:#FCE6DD;--gold-soft:#F3E6C8;--seal:#C23B2E;--ink:#2E2420;--gray:#85766C;--line:#EADFD1;--bad:#C23B2E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);background-image:radial-gradient(900px 500px at 100% -5%,#FFEDE2 0%,transparent 60%),radial-gradient(700px 420px at -10% 30%,#F7EBDB 0%,transparent 60%);
  font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;font-size:17px}
.home{align-self:center;width:100%;max-width:520px;margin-bottom:12px}
.home a{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);color:var(--orange-d);font-weight:700;font-size:15px;padding:8px 16px 8px 12px;border-radius:99px;text-decoration:none}
.box{position:relative;overflow:hidden;width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(110,70,40,.10);padding:28px 26px 26px;text-align:center;isolation:isolate}
.box::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--gold-soft);border-radius:18px;pointer-events:none}
.stamp{position:absolute;right:16px;bottom:14px;width:90px;opacity:.12;transform:rotate(-12deg);z-index:-1}
.brand{display:flex;align-items:center;justify-content:center;gap:12px}
.brand img{width:64px;height:64px;object-fit:contain}
.brand b{font-family:'Baloo 2',sans-serif;font-size:24px;color:var(--seal)}
.lock{width:74px;height:74px;margin:20px auto 8px;border-radius:20px;background:var(--seal);display:grid;place-items:center;transform:rotate(-5deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}
.lock svg{width:38px;height:38px;color:#F6EBD9}
.k{font-family:'Noto Serif SC',serif;font-weight:700;font-size:18px;color:var(--gray);margin-top:6px}
h1{font-family:'Noto Serif SC',serif;font-weight:900;font-size:34px;line-height:1.2;margin:4px 0 6px;color:var(--orange-d)}
p{margin:6px 0;color:var(--gray);font-size:16px}
.field{margin-top:18px}
input{width:100%;font:inherit;font-size:22px;letter-spacing:.08em;text-align:center;text-transform:uppercase;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--paper)}
input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px var(--orange-soft)}
button.go{margin-top:14px;border:0;border-radius:99px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;padding:13px 36px;background:linear-gradient(135deg,var(--orange),var(--orange-d));color:#fff;box-shadow:0 10px 22px rgba(196,83,62,.28);cursor:pointer}
button.go[disabled]{opacity:.6}
.msg{min-height:24px;margin-top:12px;font-weight:600;font-size:15.5px;color:var(--bad)}
.msg.ok{color:#3E8E5A}
.zalo{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:#EADBC2;border:1px solid #DCC8A6;color:var(--ink);text-decoration:none;font-weight:700;border-radius:99px;padding:6px 14px;font-size:15px}
.who{margin-top:10px;font-size:14px;color:var(--gray)}
.who button{border:0;background:none;color:var(--orange-d);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.loading{margin-top:20px;font-weight:700;color:var(--orange-d)}
</style>
</head>

<script>
const UNIT="L3";
const panel=document.getElementById("panel");
async function openLesson(){
  try{const html=await GY.decrypt(UNIT,document.getElementById("gy-data").textContent.trim());
    document.open();document.write(html);document.close();return true}
  catch(e){if(e.message==="old"){panel.innerHTML='<p class="msg">Trình duyệt quá cũ. Hãy cập nhật iOS / Chrome rồi mở lại.</p>';return true}return false}
}
function form(msg,ok){
  const s=GY.rawSession();
  panel.innerHTML=`<p>Bài này dành cho học viên đã đăng ký. Nhập <b>mã học viên</b> Thầy Vy đã gửi cho bạn.</p>
   <div class="field"><input id="code" placeholder="VD: GY-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${s&&s.code?s.code:""}"></div>
   <button class="go" id="go" type="button">Mở bài</button>
   <div class="msg ${ok?"ok":""}" id="msg">${msg||""}</div>
   <a class="zalo" href="https://zalo.me/${window.GY_ZALO||""}" target="_blank" rel="noopener">💬 Zalo Thầy Vy ${window.GY_ZALO||""}</a>
   ${s&&s.name?`<div class="who">Đang dùng mã của <b>${s.name}</b> · <button type="button" id="out">Đổi mã</button></div>`:""}`;
  const go=document.getElementById("go"),inp=document.getElementById("code");
  const run=async()=>{go.disabled=true;go.textContent="Đang kiểm tra…";const r=await GY.login(inp.value);go.disabled=false;go.textContent="Mở bài";
    if(!r.ok){document.getElementById("msg").textContent=GY.ERR[r.error]||"Có lỗi, thử lại sau.";return}
    if(!GY.key(UNIT)){form(`Mã của <b>${r.name}</b> chưa được mở bài này. Liên hệ Thầy Vy để mở thêm.`);return}
    panel.innerHTML='<div class="loading">Đang mở bài…</div>';if(!await openLesson())form("Không mở được bài, thử tải lại trang.")};
  go.addEventListener("click",run);inp.addEventListener("keydown",e=>{if(e.key==="Enter")run()});
  const out=document.getElementById("out");if(out)out.addEventListener("click",()=>{GY.logout();form()});
}
(async()=>{
  let s=GY.session();
  if(s){const r=await GY.refresh(false);s=r}
  if(s&&GY.key(UNIT)){if(await openLesson())return}
  const raw=GY.rawSession();
  form(raw&&new Date(raw.exp)<new Date()?GY.ERR.expired:(s&&!GY.key(UNIT)?`Mã của <b>${s.name}</b> chưa được mở bài này. Liên hệ Thầy Vy để mở thêm.`:""));
})();
</script>
</body>
</html>
